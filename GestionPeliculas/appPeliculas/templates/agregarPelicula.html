<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% load static%}
    <script src="{% static '../static/js/app.js' %}"></script>
    <title>agregar una Pelicula</title>
</head>
<body>
   <div class="container">
        <div class="form-group">
            <div class="">
                <h3 class="fw-bold">AGREGAR UNA PELICULA</h3>
                <form action="/agregarPelicula/" method="POST" enctype="multipart/form-data" class="was-validated">
                    {% csrf_token %}
                    <div>
                        <label for="txtCodigo" class="fw-bold">Código</label>
                        <input type="text" id="txtCodigo" name="txtCodigo" class="form-control" required>
                    </div>
                    <div>
                        <label for="txtTitulo" class="fw-bold">Título</label>
                        <input type="text" id="txtTitulo" name="txtTitulo" class="form-control" required>
                    </div>
                    <div>
                        <label for="txtProtagonista" class="fw-bold">Protagonista</label>
                        <input type="text" id="txtProtagonista" name="txtProtagonista" class="form-control" required>
                    </div>
                    <div>
                        <label for="txtDuracion" class="fw-bold">Duración (minutos)</label>
                        <input type="number" id="txtDuracion" name="txtDuracion" class="form-control" required>
                    </div>
                    <div>
                        <label for="txtResumen" class="fw-bold">Resumen</label>
                        <textarea id="txtResumen" name="txtResumen"  class="form-control" required></textarea>
                    </div>
                    <div>
                        <label for="cbGenero" class="fw-bold">Género</label>
                        <select id="cbGenero" name="cbGenero" class="form-control" required>
                            <option value="" disabled selected>Seleccione un género</option>
                            {% for genero in generos %}
                                <option value="{{ genero.id }}">{{ genero.genNombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="fileFoto" class="fw-bold">Foto</label>
                        <input type="file" id="fileFoto" name="fileFoto" accept=".jpg,.jepg,.png,.webp" onchange="mostrarImagen(event)" required>
                    </div>
                    <div>
                        <img  id="imagenPelicula" src="" width="100" height="100"  alt="Vista previa de la imagen" class="mt-2">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                    {% if mensaje %}
                        <div class="alert alert-success mt-2">{{ mensaje }}</div>
                    {% endif %}
                </form>
            </div>    
        </div>     
    </div>
</body>
</html>
