<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <title>agregar un Genero</title>
</head>
<body>
   <div>
        <div class="container ">
            <div class="margin: 0 auto">
                <h3 >AGREGAR UN GENERO</h3>
                <form action="/agregarGenero/" method="POST" class="was-validated" >
                    {% csrf_token %}
                    <div class="mt-3">
                        <label class="fw-bold" for="txtNombre">Nombre del Genero</label>
                        <input type="text" class="form-control" id="txtNombre" name="txtNombre" required>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                    {% if mensaje %}
                    <div class="alert alert-success mt-2">{{ mensaje }}</div>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</body>
</html>
